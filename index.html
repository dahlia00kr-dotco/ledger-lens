<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전표 검토 툴</title>
<meta name="description" content="반복거래 누락·중복, 거래처별 계정패턴, 결산전표 누락을 점검하는 전표 검토 도구. 모든 데이터는 브라우저 안에서만 처리됩니다.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topnav">
  <div class="wrap">
    <div class="brand"><div class="dot">✓</div><div><h1>전표 검토 툴</h1><small>고정거래 · 계정패턴 · 결산전표 점검</small></div></div>
    <button class="btn real-only" data-act="sample">샘플 데이터</button>
    <label class="btn real-only">전표 엑셀 불러오기<input type="file" id="fJournal" multiple accept=".xlsx,.xls,.csv" hidden></label>
    <button class="btn real-only" id="bLoadDb">패턴DB 열기</button><input type="file" id="fDb" accept=".json" hidden>
    <button class="btn real-only" id="bSaveDb">패턴DB 저장</button>
    <button class="btn" id="bExport">검토결과 엑셀</button>
    <span class="monthsel">검토월 <select id="selMonth"></select></span>
  </div>
</header>
<div class="wrap">
  <div class="status" id="status"></div>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>
<footer class="footer"><div class="wrap"><b>전표 검토 툴</b><span>고정거래 누락·중복 · 거래처별 계정패턴 · 결산전표 점검</span><span class="sp"></span><span>모든 데이터는 브라우저 안에서만 처리됩니다</span></div></footer>
<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="assets/app.js"></script>
</body>
</html>
